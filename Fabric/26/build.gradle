plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases' }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

sourceSets.main.java.srcDir "gen/src/main/java"
sourceSets.main.resources.srcDir "gen/src/main/resources"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    compileOnly localRuntime("net.fabricmc:fabric-loader:${project.loader_version}")
    compileOnly localRuntime("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")
    compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    // gson's GsonBuilder carries ErrorProne @InlineMe annotations. Without the annotation classes on
    // the compile classpath javac cannot resolve them and emits two [classfile] warnings, which the
    // zero-warning gate counts. Making them resolvable is the IDEAL fix, not a suppression: nothing
    // is shipped (compileOnly) and every -Xlint category stays on.
    compileOnly "com.google.errorprone:error_prone_annotations:2.28.0"
}

processResources {
    def ep = ["version": project.version, "loaderMin": project.loader_min,
              "minecraftRange": project.minecraft_range, "fabricApiMin": project.fabric_api_min]
    inputs.properties(ep)
    filesMatching("fabric.mod.json") { expand(ep) }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
    it.options.compilerArgs += ['-Xlint:all']
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
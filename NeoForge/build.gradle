plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

version = "${mod_version}+${minecraft_version}-neoforge"
group = 'com.kishku7.autoshieldreborn'
base { archivesName = 'autoshield-reborn' }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Shared MC-coupled core + mixins + shared client (single source of truth).
sourceSets.main.java.srcDir "../shared_minecraft/src/main/java"
sourceSets.main.resources.srcDir "../shared_minecraft/src/main/resources"

neoForge {
    version = project.neo_version
    runs {
        server { server(); programArgument '--nogui' }
        client { client() }
    }
    mods {
        autoshield_reborn { sourceSet(sourceSets.main) }
    }
}

processResources {
    def ep = [mod_version: mod_version]
    inputs.properties(ep)
    filesMatching('META-INF/neoforge.mods.toml') { expand(ep) }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

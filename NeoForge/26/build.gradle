plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

version = "${project.mod_version}+${project.minecraft_version}-neoforge"
group = 'com.kishku7.autoshieldreborn'
base { archivesName = 'autoshield-reborn' }

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version.toInteger())

sourceSets.main.java.srcDir "gen/src/main/java"
sourceSets.main.resources.srcDir "gen/src/main/resources"

neoForge {
    version = project.neo_version
    runs {
        server { server(); programArgument '--nogui' }
        client { client() }
    }
    mods {
        autoshield_reborn { sourceSet(sourceSets.main) }
    }
}

processResources {
    def ep = [mod_version: project.mod_version, mcRange: project.mc_range, neoforgeRange: project.neoforge_range]
    inputs.properties(ep)
    filesMatching('META-INF/neoforge.mods.toml') { expand(ep) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all']
}